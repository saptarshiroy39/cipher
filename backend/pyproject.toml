[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cipher-backend"
version = "1.5.0"
description = "Cryptography Toolkit"
authors = [
    {name = "Saptarshi Roy"},
    {name = "Krishnendu Das"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115.3",
    "gunicorn>=23.0.0",
    "pydantic>=2.10.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "pycryptodome>=3.23.0",
    "websockets>=16.0",
    "sse-starlette>=2.1.0",
    "sizelib>=0.2.3",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "RUF"]
ignore = ["E501", "N803", "N806", "RUF059"]

[tool.setuptools]
packages = ["app"]
